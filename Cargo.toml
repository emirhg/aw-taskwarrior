[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
aw-taskwarrior-core = { path = "crates/aw-taskwarrior-core" }
aw-taskwarrior-provider-cli = { path = "crates/aw-taskwarrior-provider-cli" }
aw-taskwarrior-provider-http = { path = "crates/aw-taskwarrior-provider-http" }
aw-client-rust = { git = "https://github.com/ActivityWatch/aw-server-rust", rev = "2875df5" }
aw-models = { git = "https://github.com/ActivityWatch/aw-server-rust", rev = "2875df5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
ctrlc = "3"
chrono = { version = "0.4", features = ["serde"] }
gethostname = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
